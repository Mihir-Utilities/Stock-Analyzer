# ingest_mf_navs: 22:00 and 04:00 IST (docs/04 3.5). GitHub cron is UTC and best-effort; the job works from data state, so a late or
# skipped run catches up on the next one (SYS-03). Actions are pinned by commit SHA (docs/04 1.8).
name: ingest_mf_navs

on:
  schedule:
    - cron: '30 16 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-mf-navs
  cancel-in-progress: false

jobs:
  run:
    name: ingest_mf_navs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install worker environment
        run: uv sync --project apps/worker --locked
      - name: Run ingest_mf_navs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --project apps/worker python -m worker run ingest_mf_navs
