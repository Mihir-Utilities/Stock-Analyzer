# sync_mf_schemes: Sunday 05:00 IST (docs/04 3.6). GitHub cron is UTC and best-effort; the job works from data state, so a late or
# skipped run catches up on the next one (SYS-03). Actions are pinned by commit SHA (docs/04 1.8).
name: sync_mf_schemes

on:
  schedule:
    - cron: '30 23 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-mf-schemes
  cancel-in-progress: false

jobs:
  run:
    name: sync_mf_schemes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.7"
      - name: Install worker environment
        run: uv sync --project apps/worker --locked
      - name: Run sync_mf_schemes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --project apps/worker python -m worker run sync_mf_schemes
