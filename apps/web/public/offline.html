<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #0b0f14;
        color: #e8edf3;
      }
      main {
        max-width: 36rem;
      }
      p {
        color: #a5b1c0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        The app could not reach the server. Pages that were already open keep the data they loaded,
        which may be out of date. Reconnect and reload this page.
      </p>
      <p>
        Personal research tool. Data may be delayed, incomplete or wrong. Not investment advice.
      </p>
    </main>
  </body>
</html>
