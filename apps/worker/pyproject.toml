[project]
name = "india-analyzer-worker"
version = "0.1.0"
description = "India Stock & MF Analyzer worker (T00 skeleton)"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[dependency-groups]
dev = [
  "anyio>=4.15.1",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

# D-N / SAF-13: one egress module owns every HTTP client; nothing else may import one.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use worker.egress.make_client (D-N egress allow-list)."
"urllib.request".msg = "Use worker.egress.make_client (D-N egress allow-list)."
"urllib3".msg = "Use worker.egress.make_client (D-N egress allow-list)."
"http.client".msg = "Use worker.egress.make_client (D-N egress allow-list)."
"aiohttp".msg = "Use worker.egress.make_client (D-N egress allow-list)."
"httpx".msg = "httpx may only be imported by worker/egress.py (D-N egress allow-list)."

[tool.ruff.lint.per-file-ignores]
"worker/egress.py" = ["TID251"]
"**/tests/**" = ["S101", "E501", "S311"]
"scripts/**" = ["S603", "S607", "E501"]  # repo tooling runs fixed, trusted commands (uv, go)

[tool.mypy]
python_version = "3.11"
files = ["worker"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs TEST_DATABASE_URL (Postgres 16 with the db/migrations applied)"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true  # asyncpg ships no type stubs
