[project]
name = "india-analyzer-worker"
version = "0.1.0"
description = "India Stock & MF Analyzer worker (T00 skeleton)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "E501"]
"scripts/**" = ["S603", "S607", "E501"]  # repo tooling runs fixed, trusted commands (uv, go)

[tool.mypy]
python_version = "3.11"
files = ["worker/adapters", "worker/analytics"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
