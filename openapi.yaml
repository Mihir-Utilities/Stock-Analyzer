    post:
      operationId: "postImportsKindValidate"
      tags:
        - "imports"
      summary: "Validate an upload (multipart, 5 MB / 50,000 rows; prices 25 MB / 300,000 rows; mf_statement 2 MB / 5,000 rows, CSV or .xlsx, type checked by content, read-only parsing, columns Date | Fund Name | Transaction Type | Folio No | Units Traded | NAV | Amount | Stamp Duty; data.mf carries date_from, date_to, rows_by_type, funds[], unmapped_funds[] (with scheme candidates), fund_mappings[], duplicate_groups[], duplicates_in_db). Nothing is written. (docs/03 section 14, 12a)"
      parameters:
        - name: "kind"
          in: "path"
          required: true
          description: "Import kind."
          schema:
            type: "string"
            enum:
              - "prices"
              - "instruments"
              - "holidays"
              - "results_quarterly"
              - "results_annual"
              - "balance_cashflow"
              - "fundamentals_long"
              - "shareholding"
              - "corporate_actions"
              - "instrument_meta"
              - "mf_statement"
        - "$ref": "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              properties:
                file:
                  type: "string"
                  format: "binary"
              required:
                - "file"
      responses:
        "200":
          description: "Success. data: {upload_id, upload_group, rows, preview (first 20 normalized rows), errors[{row,column,message,code?}], warnings[], error_count, warning_count, estimated_growth_mb (prices), prices_already_adjusted (prices; null = not chosen yet)}. Row numbers are file lines (header = 1). The error and warning lists keep the first 200 entries; the counts are complete. Nothing is written; the file is stored in import_upload for 1 hour. 413 when the file exceeds the byte limit (5 MB; prices 5 MB until spike S9 passes, then 25 MB); 422 for more rows than allowed, a wrong type (CSV only; xlsx, zip and UTF-16 are refused, except for mf_statement which also takes .xlsx) or no file; 404 for an unknown kind. 429 RATE_LIMITED with Retry-After when 10 validated uploads or 100 MB of them are already waiting for a commit (they expire after 1 hour)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "404":
          "$ref": "#/components/responses/NotFound"
        "413":
          description: "Body or file too large (envelope BAD_REQUEST)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
