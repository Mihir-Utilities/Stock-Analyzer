components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "session"
      description: "httpOnly, Secure, SameSite=Lax session cookie."
  parameters:
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
      description: "Page size (values above 200 are clamped)."
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
      description: "Opaque keyset cursor from next_cursor."
    CsrfHeader:
      name: "X-Requested-With"
      in: "header"
      required: true
      schema:
        type: "string"
        enum:
          - "fetch"
      description: "CSRF guard for non-GET requests."
  schemas:
    Meta:
      type: "object"
      properties:
        as_of:
          type: "string"
          format: "date-time"
        source:
          type: "string"
        stale:
          type: "boolean"
        stale_age_hours:
          type: "number"
        interval:
          type: "string"
          enum:
            - "1d"
            - "1w"
        excluded_for_missing:
          type: "object"
          additionalProperties:
            type: "integer"
            format: "int64"
      additionalProperties: true
      description: "Optional response metadata. Unavailable values are null with a *_reason sibling or a warning, never 0."
    Warning:
      type: "object"
      properties:
        code:
          type: "string"
        message:
          type: "string"
      required:
        - "code"
        - "message"
    SuccessEnvelope:
      type: "object"
      properties:
        data:
          type: "object"
          additionalProperties: true
        meta:
          "$ref": "#/components/schemas/Meta"
        warnings:
          type: "array"
          items:
            "$ref": "#/components/schemas/Warning"
      required:
        - "data"
      description: "Success envelope. Each owning task replaces the generic `data` schema with the exact shape of its endpoint (contract change rule: docs/03, openapi.yaml, docs/field-map.json together)."
    FieldError:
      type: "object"
      properties:
        field:
          type: "string"
        message:
          type: "string"
      required:
        - "field"
        - "message"
    ErrorBody:
      type: "object"
      properties:
        code:
          type: "string"
          description: "BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, UNPROCESSABLE, RATE_LIMITED, DATA_UNAVAILABLE, SOURCE_DOWN, INTERNAL, NOT_IMPLEMENTED (B01 stubs), plus task-specific 422 codes such as PRICE_MODE_MANUAL, BROKER_DISABLED, INSUFFICIENT_HOLDINGS, PRICES_ADJUSTMENT_UNSET, DB_SIZE_LIMIT, THRESHOLD_ALREADY_MET."
        message:
          type: "string"
        details:
          type: "object"
          additionalProperties: true
          description: "422: fields[]; 429: retry_after_seconds; DATA_UNAVAILABLE: reason."
      required:
        - "code"
        - "message"
    ErrorEnvelope:
      type: "object"
      properties:
        error:
          "$ref": "#/components/schemas/ErrorBody"
      required:
        - "error"
      example:
        error:
          code: "NOT_FOUND"
          message: "Instrument not found"
          details:
            symbol: "XYZ"
    Page:
      type: "object"
      properties:
        items:
          type: "array"
          items: {}
        next_cursor:
          type: "string"
          nullable: true
      required:
        - "items"
        - "next_cursor"
      description: "Keyset page: the `data` payload of paginated lists."
    Health:
      type: "object"
      properties:
        ok:
          type: "boolean"
          enum:
            - true
      required:
        - "ok"
      example:
        ok: true
    FreeObject:
      type: "object"
      additionalProperties: true
      description: "Body shape is defined by the owning task from docs/03."
    LoginRequest:
      type: "object"
      properties:
        password:
          type: "string"
          minLength: 1
          maxLength: 200
      required:
        - "password"
      additionalProperties: false
    ChangePasswordRequest:
      type: "object"
      properties:
        current:
          type: "string"
        new:
          type: "string"
          minLength: 12
      required:
        - "current"
        - "new"
      additionalProperties: false
    ConfirmBody:
      type: "object"
      properties:
        confirm:
          type: "boolean"
          enum:
            - true
      required:
        - "confirm"
      additionalProperties: false
    TrimRequest:
      type: "object"
      properties:
        symbols:
          type: "array"
          items:
            type: "string"
          minItems: 1
        before:
          type: "string"
          format: "date"
        confirm:
          type: "boolean"
          enum:
            - true
      required:
        - "symbols"
        - "before"
        - "confirm"
      additionalProperties: false
    TrimPreviewRequest:
      type: "object"
      properties:
        symbols:
          type: "array"
          items:
            type: "string"
          minItems: 1
        before:
          type: "string"
          format: "date"
      required:
        - "symbols"
        - "before"
      additionalProperties: false
    ScreenerFilter:
      type: "object"
      properties:
        metric:
          type: "string"
        op:
          type: "string"
          enum:
            - ">"
            - ">="
            - "<"
            - "<="
            - "="
            - "between"
            - "in"
        value:
          description: "number, string, [number, number] for between, or string[] (max 50) for in."
      required:
        - "metric"
        - "op"
        - "value"
    ScreenerQuery:
      type: "object"
      properties:
        filters:
          type: "array"
          items:
            "$ref": "#/components/schemas/ScreenerFilter"
          maxItems: 12
        sort:
          type: "object"
          properties:
            metric:
              type: "string"
            dir:
              type: "string"
              enum:
                - "asc"
                - "desc"
        limit:
          type: "integer"
          minimum: 1
          maximum: 200
        cursor:
          type: "string"
          nullable: true
        universe:
          type: "object"
          properties:
            index:
              type: "string"
            kind:
              type: "string"
            company_type:
              type: "string"
      required:
        - "filters"
    SavedScreenCreate:
      type: "object"
      properties:
        name:
          type: "string"
        spec:
          "$ref": "#/components/schemas/ScreenerQuery"
      required:
        - "name"
        - "spec"
    WatchlistCreate:
      oneOf:
        - type: "object"
          properties:
            type:
              type: "string"
              enum:
                - "stock"
            symbol:
              type: "string"
            note:
              type: "string"
              maxLength: 500
          required:
            - "type"
            - "symbol"
        - type: "object"
          properties:
            type:
              type: "string"
              enum:
                - "mf"
            code:
              type: "integer"
              format: "int64"
          required:
            - "type"
            - "code"
    WatchlistPatch:
      type: "object"
      properties:
        note:
          type: "string"
          maxLength: 500
      required:
        - "note"
    TxnCreate:
      type: "object"
      properties:
        symbol:
          type: "string"
        side:
          type: "string"
          enum:
            - "buy"
            - "sell"
        qty:
          type: "string"
          description: "Decimal string, 0 < qty <= 1e9."
        price:
          type: "string"
        fees:
          type: "string"
        trade_date:
          type: "string"
          format: "date"
        note:
          type: "string"
      required:
        - "symbol"
        - "side"
        - "qty"
        - "price"
        - "trade_date"
    AdjustmentCreate:
      type: "object"
      properties:
        symbol:
          type: "string"
        effective_date:
          type: "string"
          format: "date"
          description: "The ex-date; not in the future."
        qty_multiplier:
          type: "string"
          description: "Decimal string, 0 < m <= 1000000, up to 8 decimals (a 10 -> 2 split is 5)."
        corporate_action_id:
          type: "integer"
          format: "int64"
          description: "Optional; must belong to the symbol and have the same ex-date."
        note:
          type: "string"
          maxLength: 500
      required:
        - "symbol"
        - "effective_date"
        - "qty_multiplier"
      additionalProperties: false
    TxnPatch:
      type: "object"
      additionalProperties: true
      description: "Same fields as TxnCreate, all optional."
    AlertCreate:
      type: "object"
      properties:
        target:
          type: "object"
          properties:
            type:
              type: "string"
              enum:
                - "stock"
                - "mf"
            symbol:
              type: "string"
            code:
              type: "integer"
              format: "int64"
          required:
            - "type"
        kind:
          type: "string"
          enum:
            - "price_above"
            - "price_below"
            - "day_change_pct"
            - "wk52_high"
            - "wk52_low"
            - "ma_cross"
            - "rsi_above"
            - "rsi_below"
            - "results_upcoming"
            - "results_declared"
            - "holding_change"
            - "nav_above"
            - "nav_below"
        params:
          type: "object"
          additionalProperties: true
        one_shot:
          type: "boolean"
        cooldown_minutes:
          type: "integer"
          format: "int64"
        expires_on:
          type: "string"
          format: "date"
      required:
        - "target"
        - "kind"
    AlertPatch:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "active"
            - "paused"
        params:
          type: "object"
          additionalProperties: true
      description: "At least one of status, params. Unknown keys are a 400."
    AlertTarget:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "stock"
            - "mf"
        symbol:
          type: "string"
        code:
          type: "integer"
          format: "int64"
        name:
          type: "string"
      required:
        - "type"
    Alert:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        target:
          "$ref": "#/components/schemas/AlertTarget"
        kind:
          type: "string"
        params:
          type: "object"
          additionalProperties: true
        status:
          type: "string"
          enum:
            - "active"
            - "paused"
            - "fired"
            - "expired"
        one_shot:
          type: "boolean"
        cooldown_minutes:
          type: "integer"
          format: "int64"
        expires_on:
          type: "string"
          format: "date"
          nullable: true
        last_fired_at:
          type: "string"
          format: "date-time"
          nullable: true
        created_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "target"
        - "kind"
        - "params"
        - "status"
        - "one_shot"
        - "cooldown_minutes"
        - "created_at"
    AlertEvent:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        alert_id:
          type: "integer"
          format: "int64"
        kind:
          type: "string"
        target:
          "$ref": "#/components/schemas/AlertTarget"
        fired_at:
          type: "string"
          format: "date-time"
        payload:
          type: "object"
          additionalProperties: true
        delivery_status:
          type: "string"
          enum:
            - "pending"
            - "sent"
            - "failed"
            - "skipped_quiet_hours"
        delivery_attempts:
          type: "integer"
          format: "int64"
        delivered_at:
          type: "string"
          format: "date-time"
          nullable: true
        last_error:
          type: "string"
          nullable: true
      required:
        - "id"
        - "alert_id"
        - "kind"
        - "target"
        - "fired_at"
        - "payload"
        - "delivery_status"
        - "delivery_attempts"
    LinkCode:
      type: "object"
      properties:
        code:
          type: "string"
          example: "A7K9-Q2XM"
        expires_at:
          type: "string"
          format: "date-time"
        bot_username:
          type: "string"
          nullable: true
        deep_link:
          type: "string"
          nullable: true
      required:
        - "code"
        - "expires_at"
        - "bot_username"
        - "deep_link"
    AlertEnvelope:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/Alert"
        meta:
          "$ref": "#/components/schemas/Meta"
        warnings:
          type: "array"
          items:
            "$ref": "#/components/schemas/Warning"
      required:
        - "data"
      description: "Success envelope with one alert."
    AlertPageEnvelope:
      type: "object"
      properties:
        data:
          type: "object"
          properties:
            items:
              type: "array"
              items:
                "$ref": "#/components/schemas/Alert"
            next_cursor:
              type: "string"
              nullable: true
          required:
            - "items"
            - "next_cursor"
        meta:
          "$ref": "#/components/schemas/Meta"
        warnings:
          type: "array"
          items:
            "$ref": "#/components/schemas/Warning"
      required:
        - "data"
      description: "Success envelope with a page of alerts."
    AlertEventPageEnvelope:
      type: "object"
      properties:
        data:
          type: "object"
          properties:
            items:
              type: "array"
              items:
                "$ref": "#/components/schemas/AlertEvent"
            next_cursor:
              type: "string"
              nullable: true
          required:
            - "items"
            - "next_cursor"
        meta:
          "$ref": "#/components/schemas/Meta"
        warnings:
          type: "array"
          items:
            "$ref": "#/components/schemas/Warning"
      required:
        - "data"
      description: "Success envelope with a page of alert events."
    LinkCodeEnvelope:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/LinkCode"
        meta:
          "$ref": "#/components/schemas/Meta"
        warnings:
          type: "array"
          items:
            "$ref": "#/components/schemas/Warning"
      required:
        - "data"
      description: "Success envelope with a Telegram link code."
    ImportCommit:
      type: "object"
      properties:
        upload_id:
          type: "string"
          format: "uuid"
        upload_ids:
          type: "array"
          items:
            type: "string"
            format: "uuid"
        upload_group:
          type: "string"
          format: "uuid"
        note:
          type: "string"
      description: "Either upload_id, or upload_ids with upload_group (large prices file split by the browser)."
    PricesAdjustmentPut:
      type: "object"
      properties:
        value:
          type: "boolean"
        confirm:
          type: "boolean"
      required:
        - "value"
    AdjustmentCheckRequest:
      type: "object"
      properties:
        upload_id:
          type: "string"
          format: "uuid"
        symbol:
          type: "string"
        ex_date:
          type: "string"
          format: "date"
        expected_ratio:
          type: "object"
          properties:
            num:
              type: "integer"
              format: "int64"
            den:
              type: "integer"
              format: "int64"
          required:
            - "num"
            - "den"
      required:
        - "upload_id"
        - "symbol"
        - "ex_date"
    InstrumentCreate:
      type: "object"
      properties:
        symbol:
          type: "string"
        name:
          type: "string"
        isin:
          type: "string"
      required:
        - "symbol"
        - "name"
      additionalProperties: false
    ResultsEntry:
      type: "object"
      properties:
        basis:
          type: "string"
          enum:
            - "consolidated"
            - "standalone"
        period_type:
          type: "string"
          enum:
            - "Q"
            - "A"
        period_end:
          type: "string"
          format: "date"
        values:
          type: "object"
          description: "Keys: revenue, ebitda, operating_income, other_income, interest, depreciation, pbt, tax, net_profit, eps (INR crore except eps in INR). A number, a numeric string or null/empty (not stored); at least one value."
          additionalProperties:
            type: "number"
            nullable: true
        note:
          type: "string"
          maxLength: 500
      required:
        - "basis"
        - "period_type"
        - "period_end"
        - "values"
      additionalProperties: false
    ShareholdingEntry:
      type: "object"
      description: "One shareholding quarter (docs/01 7.3). Percent numbers 0-100 (numbers or numeric strings); blank or null = unknown (never 0)."
      properties:
        quarter_end:
          type: "string"
          format: "date"
        promoter: {type: "number", nullable: true}
        fii: {type: "number", nullable: true}
        dii: {type: "number", nullable: true}
        mf: {type: "number", nullable: true}
        insurance: {type: "number", nullable: true}
        govt: {type: "number", nullable: true}
        public: {type: "number", nullable: true}
        pledged_of_promoter: {type: "number", nullable: true}
        shareholders_count: {type: "integer", nullable: true}
        filed_on:
          type: "string"
          format: "date"
          nullable: true
        note:
          type: "string"
          maxLength: 500
      required:
        - "quarter_end"
      additionalProperties: false
    ActionEntry:
      type: "object"
      description: "One corporate action (docs/01 7.4), stored as confirmed. split: ratio_num = old face value, ratio_den = new; bonus: ratio_num = new shares, ratio_den = held."
      properties:
        ex_date:
          type: "string"
          format: "date"
        type:
          type: "string"
          enum:
            - "split"
            - "bonus"
            - "dividend"
            - "rights"
            - "buyback"
            - "merger"
            - "demerger"
            - "other"
        ratio_num: {type: "number", nullable: true}
        ratio_den: {type: "number", nullable: true}
        amount_per_share: {type: "number", nullable: true}
        purpose_text:
          type: "string"
          maxLength: 500
          nullable: true
        note:
          type: "string"
          maxLength: 500
      required:
        - "ex_date"
        - "type"
      additionalProperties: false
    ActionStatusPatch:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "confirmed"
            - "rejected"
      required:
        - "status"
      additionalProperties: false
  responses:
    BadRequest:
      description: "BAD_REQUEST"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "FORBIDDEN (non-GET request without `X-Requested-With: fetch`)"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: "UNAUTHENTICATED (no valid session cookie)"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: "NOT_FOUND or DATA_UNAVAILABLE"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: "UNPROCESSABLE (details.fields[]) or a task-specific 422 code"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: "RATE_LIMITED (details.retry_after_seconds)"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
      headers:
        "Retry-After":
          description: "Seconds to wait."
          schema:
            type: "integer"
            format: "int64"
    NotImplemented:
      description: "NOT_IMPLEMENTED: stub until the owning task lands (B01)"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Internal:
      description: "INTERNAL"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
