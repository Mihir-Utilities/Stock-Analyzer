                "$ref": "#/components/schemas/ErrorEnvelope"
  "/broker/session":
    delete:
      operationId: "deleteBrokerSession"
      tags:
        - "broker"
      summary: "Not built in manual price mode: always 422 BROKER_DISABLED. (docs/03 section 14a)"
      parameters:
        - "$ref": "#/components/parameters/CsrfHeader"
      responses:
        "422":
          "$ref": "#/components/responses/Unprocessable"
        default:
