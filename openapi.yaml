          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "session"
      description: "httpOnly, Secure, SameSite=Lax session cookie."
  parameters:
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
      description: "Page size (values above 200 are clamped)."
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
      description: "Opaque keyset cursor from next_cursor."
    CsrfHeader:
      name: "X-Requested-With"
      in: "header"
      required: true
      schema:
        type: "string"
        enum:
          - "fetch"
      description: "CSRF guard for non-GET requests."
  schemas:
    Meta:
      type: "object"
      properties:
        as_of:
          type: "string"
          format: "date-time"
        source:
          type: "string"
        stale:
          type: "boolean"
        stale_age_hours:
          type: "number"
        interval:
          type: "string"
          enum:
            - "1d"
            - "1w"
        excluded_for_missing:
          type: "object"
          additionalProperties:
            type: "integer"
            format: "int64"
      additionalProperties: true
      description: "Optional response metadata. Unavailable values are null with a *_reason sibling or a warning, never 0."
    Warning:
      type: "object"
      properties:
        code:
          type: "string"
        message:
          type: "string"
      required:
        - "code"
        - "message"
    SuccessEnvelope:
      type: "object"
      properties:
        data:
          type: "object"
          additionalProperties: true
        meta:
          "$ref": "#/components/schemas/Meta"
        warnings:
          type: "array"
          items:
            "$ref": "#/components/schemas/Warning"
      required:
        - "data"
      description: "Success envelope. Each owning task replaces the generic `data` schema with the exact shape of its endpoint (contract change rule: docs/03, openapi.yaml, docs/field-map.json together)."
    InvBestWorst:
      type: "object"
      description: "A monthly or yearly return with the calendar year it happened in (percent number)."
      properties:
        pct:
          type: "number"
        year:
          type: "integer"
      required:
        - "pct"
        - "year"
    InvYearReturn:
      type: "object"
      description: "One row of analysis.year_returns (docs/05 12.1): price return of a calendar year in percent (dividends excluded). kind full = December close over the prior December close; partial_first = first year of history from the first month-end close; ytd = running year to the last bar."
      properties:
        year:
          type: "integer"
        return_pct:
          type: "number"
          nullable: true
        return_pct_reason:
          type: "string"
          nullable: true
          description: "no_base | gap_before | incomplete_month_data when return_pct is null."
        kind:
          type: "string"
          enum:
            - "full"
            - "partial_first"
            - "ytd"
        months_covered:
          type: "integer"
        base_date:
          type: "string"
          format: "date"
          nullable: true
        end_date:
          type: "string"
          format: "date"
          nullable: true
      required:
        - "year"
        - "return_pct"
        - "kind"
        - "months_covered"
    InvSeasonalityMonth:
      type: "object"
      description: "Statistics of one calendar month over all closed past months with a return (docs/05 12.2). Percent fields are percent numbers; green_pct is null with reason too_few_years below min_years."
      properties:
        month:
          type: "integer"
          minimum: 1
          maximum: 12
        n_years:
          type: "integer"
        n_green:
          type: "integer"
        green_pct:
          type: "number"
          nullable: true
        green_pct_reason:
          type: "string"
          nullable: true
        avg_pct:
          type: "number"
          nullable: true
        median_pct:
          type: "number"
          nullable: true
        best:
          allOf:
            - "$ref": "#/components/schemas/InvBestWorst"
          nullable: true
        worst:
          allOf:
            - "$ref": "#/components/schemas/InvBestWorst"
          nullable: true
        small_sample:
          type: "boolean"
      required:
        - "month"
        - "n_years"
        - "n_green"
        - "green_pct"
        - "small_sample"
    InvSeasonalityYears:
      type: "object"
      description: "Same statistics over the full calendar years only (the Year column summary)."
      properties:
        n:
          type: "integer"
        n_green:
          type: "integer"
        green_pct:
          type: "number"
          nullable: true
        green_pct_reason:
          type: "string"
          nullable: true
        avg_pct:
          type: "number"
          nullable: true
        median_pct:
          type: "number"
          nullable: true
        best:
          allOf:
            - "$ref": "#/components/schemas/InvBestWorst"
          nullable: true
        worst:
          allOf:
            - "$ref": "#/components/schemas/InvBestWorst"
          nullable: true
        small_sample:
          type: "boolean"
      required:
        - "n"
        - "n_green"
        - "green_pct"
        - "small_sample"
    InvSeasonalityRunning:
      type: "object"
      description: "The running (open) calendar month: month to date, never part of any statistic."
      properties:
        year:
          type: "integer"
        month:
          type: "integer"
        mtd_return_pct:
          type: "number"
          nullable: true
        mtd_reason:
          type: "string"
          nullable: true
          description: "no_bar_this_month | no_base | gap_before"
        base_date:
          type: "string"
          format: "date"
          nullable: true
        as_of:
          type: "string"
          format: "date"
      required:
        - "year"
        - "month"
        - "mtd_return_pct"
    InvMonthPick:
      type: "object"
      description: "Best or worst calendar month by median return (needs at least 2 months with 3 or more years)."
      properties:
        month:
          type: "integer"
        median_pct:
          type: "number"
        n_years:
          type: "integer"
      required:
        - "month"
        - "median_pct"
        - "n_years"
    InvSeasonality:
      type: "object"
      description: "analysis.seasonality (docs/05 12.2): month-of-year statistics over all available history (not only the displayed 10 years), the Year column summary and the running month."
      properties:
        as_of:
          type: "string"
          format: "date"
        bars:
          type: "integer"
        first_bar:
          type: "string"
          format: "date"
        last_bar:
          type: "string"
          format: "date"
        years_of_history:
          type: "number"
        min_years:
          type: "integer"
        small_sample_years:
          type: "integer"
        running:
          "$ref": "#/components/schemas/InvSeasonalityRunning"
        months:
          type: "array"
          description: "Always 12 entries, month 1..12."
          items:
            "$ref": "#/components/schemas/InvSeasonalityMonth"
        best_month:
          allOf:
            - "$ref": "#/components/schemas/InvMonthPick"
          nullable: true
        worst_month:
          allOf:
            - "$ref": "#/components/schemas/InvMonthPick"
          nullable: true
        best_worst_reason:
          type: "string"
