openapi: "3.0.3"
info:
  title: "India Stock & MF Analyzer API (Safe Edition)"
  version: "0.1.0"
  description: "Contract of docs/03-api-spec.md. All endpoints are stubs returning 501 NOT_IMPLEMENTED in the error envelope until their owning task lands (B01). Success responses use the envelope {data, meta, warnings}; errors use {error:{code,message,details}} with the HTTP status of the code. GET /healthz and GET /readyz are also served at the root path (/healthz) for the hosting health check. Non-GET requests must send `X-Requested-With: fetch` (CSRF, enforced from B02), except the Telegram webhook which uses its secret header. Private single-user app: no public pages, no CORS."
servers:
  - url: "/api/v1"
tags:
  - name: "ops"
    description: "Health and admin (section 15)"
  - name: "auth"
    description: "Auth (section 2)"
  - name: "stocks"
    description: "Stocks: search and profile (section 3)"
  - name: "prices"
    description: "Prices and indicators (section 4)"
  - name: "owner-data"
    description: "Fundamentals, ownership, events, peers, links (section 5)"
  - name: "predictions"
    description: "Prediction, experimental (section 6)"
  - name: "jobs"
    description: "Live refresh jobs (section 7)"
  - name: "market"
    description: "Market and compare (section 8)"
  - name: "screener"
    description: "Screener (section 9)"
  - name: "mutual-funds"
    description: "Mutual funds (section 10)"
  - name: "watchlist"
    description: "Watchlist (section 11)"
  - name: "portfolio"
    description: "Portfolio (section 12)"
  - name: "alerts"
    description: "Alerts and Telegram (section 13)"
  - name: "imports"
    description: "Imports and owner-entered data (section 14)"
  - name: "broker"
    description: "Broker connection (section 14a)"
security:
  - cookieAuth: []
paths:
  "/healthz":
    get:
      operationId: "getHealthz"
      tags:
        - "ops"
      summary: "Liveness (no database call). Also served at the root path /healthz. (docs/03 section 15)"
      security: []
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/readyz":
    get:
      operationId: "getReadyz"
      tags:
        - "ops"
      summary: "Readiness: pings the database (one retry after a short backoff, SYS-01). (docs/03 section 15)"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/admin/status":
    get:
      operationId: "getAdminStatus"
      tags:
        - "ops"
      summary: "Sources, jobs, coverage, database size and warn level, holiday coverage, version. (docs/03 section 15)"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/auth/login":
    post:
      operationId: "postAuthLogin"
      tags:
        - "auth"
      summary: "Log in with the owner password (argon2id, lockout, 10/min per IP). (docs/03 section 2)"
      security: []
      parameters:
        - "$ref": "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Logged in; `Set-Cookie: session=...; HttpOnly; Secure; SameSite=Lax; Path=/`. data: {authenticated, expires_at}."
          headers:
            "Set-Cookie":
              description: "The session cookie (random 32-byte token; only its sha256 is stored)."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          description: "UNAUTHENTICATED: wrong password or temporarily locked (identical message \"Invalid credentials or temporarily locked\"; 300-800 ms delay)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/auth/logout":
    post:
      operationId: "postAuthLogout"
      tags:
        - "auth"
      summary: "Revoke the current session and clear the cookie. (docs/03 section 2)"
      parameters:
        - "$ref": "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/auth/logout-all":
    post:
      operationId: "postAuthLogoutall"
      tags:
        - "auth"
      summary: "Revoke all sessions. (docs/03 section 2)"
      parameters:
        - "$ref": "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/auth/me":
    get:
      operationId: "getAuthMe"
      tags:
        - "auth"
      summary: "Current session: authenticated, telegram_linked, prefs. (docs/03 section 2)"
      responses:
        "200":
          description: "data: {authenticated: true, telegram_linked: bool, prefs: display_prefs object}"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/auth/change-password":
    post:
      operationId: "postAuthChangepassword"
      tags:
        - "auth"
      summary: "Change password (min 12 chars, differs from current; revokes other sessions). (docs/03 section 2)"
      parameters:
        - "$ref": "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks/index":
    get:
      operationId: "getStocksIndex"
      tags:
        - "stocks"
      summary: "Compact list for client-side search (ETag, Cache-Control private max-age=3600). (docs/03 section 3)"
      responses:
        "200":
          description: "Success. Items are [id, symbol, name, flags]; flags bitmask 2 tracked, 4 suspended, 8 delisted, 16 non_equity, 32 financial, 64 in_nifty50, 128 in_nifty100 (bit 1 broker_ok is always 0 in manual price mode)."
          headers:
            ETag:
              description: "Hash of the items; send it back in If-None-Match."
              schema:
                type: "string"
            Cache-Control:
              description: "private, max-age=3600"
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
              example:
                data:
                  generated_at: "2026-10-09T13:05:00Z"
                  count: 1
                  items:
                    - - 1
                      - "TCS"
                      - "Tata Consultancy Services Ltd"
                      - 3
        "304":
          description: "Not modified (If-None-Match matched the ETag); empty body."
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks":
    get:
      operationId: "getStocks"
      tags:
        - "stocks"
      summary: "Server search: exact symbol, symbol prefix, name prefix, trigram similarity (0.3). (docs/03 section 3)"
      parameters:
        - name: "q"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Min 1 character."
        - name: "index"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sector"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "kind"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Default equity."
        - name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Default active."
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Cursor"
      responses:
        "200":
          description: "Success. data = {items:[{id,symbol,name,isin,series,sector,industry,company_type,status,instrument_kind,tracked}], next_cursor}; without q the list is alphabetical."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
              example:
                data:
                  items:
                    - id: 123
                      symbol: "TCS"
                      name: "Tata Consultancy Services Ltd"
                      isin: "INE467B01029"
                      series: "EQ"
                      sector: "IT"
                      industry: "IT Services"
                      company_type: "general"
                      status: "active"
                      instrument_kind: "equity"
                      tracked: true
                  next_cursor: null
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks/{symbol}":
    get:
      operationId: "getStocksSymbol"
      tags:
        - "stocks"
      summary: "Stock profile with quote, freshness and flags. Side effects: last_opened_at, tracked set. (docs/03 section 3)"
      parameters:
        - name: "symbol"
          in: "path"
          required: true
          description: "URL-encoded exact exchange symbol, case-insensitive (M%26M, BAJAJ-AUTO); old symbols resolve through symbol_alias (data.redirect_symbol)."
          schema:
            type: "string"
      responses:
        "200":
          description: "Success. An alias answers data = {redirect_symbol} instead (HTTP 200). With no imported prices flags.no_prices is true and data.hint says to import prices.csv."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
              example:
                data:
                  id: 123
                  symbol: "TCS"
                  name: "Tata Consultancy Services Ltd"
                  isin: "INE467B01029"
                  series: "EQ"
                  sector: "IT"
                  industry: "IT Services"
                  company_type: "general"
                  status: "active"
                  instrument_kind: "equity"
                  listing_date: "2004-08-25"
                  broker_ok: null
                  tracked: true
                  price_mode: "manual"
                  quote: null
                  freshness:
                    prices_stale: false
                    holidays_missing: false
                    prices_as_of: "2026-10-09"
                    fundamentals_as_of: null
                    shareholding_as_of: null
                    predictions_as_of: null
                  flags:
                    no_prices: false
                    limited_history: false
                    series_warning: null
                meta:
                  as_of: "2026-10-09T13:05:00Z"
                  source: "import"
                  stale: false
                  stale_age_hours: 0
                warnings: []
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "404":
          "$ref": "#/components/responses/NotFound"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks/{symbol}/prices":
    get:
      operationId: "getStocksSymbolPrices"
      tags:
        - "prices"
      summary: "Price bars (max 2,000 points, LTTB / weekly candles). (docs/03 section 4)"
      parameters:
        - name: "symbol"
          in: "path"
          required: true
          description: "URL-encoded exact exchange symbol, case-insensitive (M%26M, BAJAJ-AUTO); old symbols resolve through symbol_alias (data.redirect_symbol)."
          schema:
            type: "string"
        - name: "range"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "1M"
              - "3M"
              - "6M"
              - "1Y"
              - "3Y"
              - "5Y"
              - "MAX"
            default: "1Y"
        - name: "adjusted"
          in: "query"
          required: false
          schema:
            type: "boolean"
            default: true
        - name: "downsample"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "auto"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: "deleteStocksSymbolPrices"
      tags:
        - "prices"
      summary: "Delete imported prices between two dates (owner confirm required). (docs/03 section 4)"
      parameters:
        - name: "symbol"
          in: "path"
          required: true
          description: "URL-encoded exact exchange symbol, case-insensitive (M%26M, BAJAJ-AUTO); old symbols resolve through symbol_alias (data.redirect_symbol)."
          schema:
            type: "string"
        - name: "from"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
        - "$ref": "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ConfirmBody"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks/{symbol}/prices/delete-preview":
    post:
      operationId: "postStocksSymbolPricesDeletepreview"
      tags:
        - "prices"
      summary: "Row count for a prices delete. (docs/03 section 4)"
      parameters:
        - name: "symbol"
          in: "path"
          required: true
          description: "URL-encoded exact exchange symbol, case-insensitive (M%26M, BAJAJ-AUTO); old symbols resolve through symbol_alias (data.redirect_symbol)."
          schema:
            type: "string"
        - name: "from"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
        - "$ref": "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/prices/trim":
    post:
      operationId: "postPricesTrim"
      tags:
        - "prices"
      summary: "Trim history before a date for chosen stocks (owner confirm required). (docs/03 section 4)"
      parameters:
        - "$ref": "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TrimRequest"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/prices/trim/preview":
    post:
      operationId: "postPricesTrimPreview"
      tags:
        - "prices"
      summary: "Row counts per symbol and estimated MB freed for a trim. (docs/03 section 4)"
      parameters:
        - "$ref": "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TrimPreviewRequest"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks/{symbol}/indicators":
    get:
      operationId: "getStocksSymbolIndicators"
      tags:
        - "prices"
      summary: "Latest analysis_snapshot: returns, technicals, scores, series. (docs/03 section 4)"
      parameters:
        - name: "symbol"
          in: "path"
          required: true
          description: "URL-encoded exact exchange symbol, case-insensitive (M%26M, BAJAJ-AUTO); old symbols resolve through symbol_alias (data.redirect_symbol)."
          schema:
            type: "string"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks/{symbol}/fundamentals":
    get:
      operationId: "getStocksSymbolFundamentals"
      tags:
        - "owner-data"
      summary: "Owner-supplied fundamentals with derived values. (docs/03 section 5)"
      parameters:
        - name: "symbol"
          in: "path"
          required: true
          description: "URL-encoded exact exchange symbol, case-insensitive (M%26M, BAJAJ-AUTO); old symbols resolve through symbol_alias (data.redirect_symbol)."
          schema:
            type: "string"
        - name: "basis"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "consolidated"
              - "standalone"
              - "auto"
        - name: "period"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "Q"
              - "A"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "501":
          "$ref": "#/components/responses/NotImplemented"
        default:
          description: "Error envelope"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/stocks/{symbol}/shareholding":
    get:
      operationId: "getStocksSymbolShareholding"
      tags:
        - "owner-data"
      summary: "Shareholding by quarter (promoter, FII, DII, MF, ...). (docs/03 section 5)"
      parameters:
        - name: "symbol"
          in: "path"
          required: true
          description: "URL-encoded exact exchange symbol, case-insensitive (M%26M, BAJAJ-AUTO); old symbols resolve through symbol_alias (data.redirect_symbol)."
          schema:
            type: "string"
      responses:
        "200":
          description: "Success (stub: 501 until implemented)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
