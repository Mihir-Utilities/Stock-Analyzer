                      bucket: "slightly_up"
                      band:
                        q10: -0.041
                        q50: 0.002
                        q90: 0.046
                        price_q10: 3356
                        price_q50: 3507
                        price_q90: 3661
                      hidden_reason: null
                    - days: 21
                      shown: false
                      hidden_reason: "model_not_better_than_baseline"
                  trend:
                    score: 72
                    label: "up"
                  risk:
                    score: 41
                    label: "medium"
